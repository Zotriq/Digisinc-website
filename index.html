<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Digisinc | AI & Automation, Web Apps, and Creative Design</title>
  <meta name="description" content="Digisinc is a high-performance agency specialized in AI & Automation, Full-stack Web & Apps, UI/UX, and Graphic Design. We build the tech that drives digital growth." />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "Digisinc",
    "url": "https://yourwebsite.com",
    "logo": "https://yourwebsite.com/media/images/logo.svg",
    "description": "Specialized Agency in AI & Automation, Web/App Development, UI/UX, and Graphic Design.",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "Pakistan"
    },
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Digisinc Services",
      "itemListElement": [
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI & Automation" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Web & Apps" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "UI/UX Design" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Graphic Design" } }
      ]
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.cdnfonts.com">
  <link href="https://fonts.cdnfonts.com/css/rosellinda-alyamore" rel="stylesheet">
  <link rel="shortcut icon" href="/media/images/logo.svg" type="image/x-icon">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
